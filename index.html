.toggle{width:52px;height:32px;border-radius:16px;border:none;background:#C9D2DD;position:relative;padding:0;flex:none}

.toggle.on{background:var(--me)}

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const SUPABASE_URL = "https://jbdxneivitincpvmmijh.supabase.co";
const SUPABASE_KEY = "sb_publishable_rWTRcLBlg8sbNFD7rC5hzA_22E_wy3y";
const TZ = "Asia/Beirut";
const EMAILS = { riad: "riadmohamadtawil@gmail.com", foufi: "sabbaghfarida@gmail.com" };
const REACTIONS = ["💪", "🔥", "❤️", "👏"];

// ---------- dates (always Beirut time) ----------
const fmtDay = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
const fmtWd = new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "short" });
const WD = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 };
function today() { return fmtDay.format(new Date()); }
function todayWd() { return WD[fmtWd.format(new Date())]; }
function addDays(day, n) {
  const [y, m, d] = day.split("-").map(Number);
  const t = new Date(Date.UTC(y, m - 1, d + n));
  return t.toISOString().slice(0, 10);
}
function prettyToday() {
  return new Intl.DateTimeFormat("en-GB", { timeZone: TZ, weekday: "long", day: "numeric", month: "short" }).format(new Date());
}

// ---------- streaks ----------
function streaks(doneDays, todayKey) {
  const set = new Set(doneDays);
  let cur = 0;
  let d = set.has(todayKey) ? todayKey : addDays(todayKey, -1);
  while (set.has(d)) { cur++; d = addDays(d, -1); }
  const sorted = [...set].sort();
  let best = 0, run = 0, prev = null;
  for (const x of sorted) {
    run = prev && addDays(prev, 1) === x ? run + 1 : 1;
    best = Math.max(best, run); prev = x;
  }
  return { cur, best: Math.max(best, cur) };
}

// ---------- local storage helpers ----------
function load(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// ---------- state ----------
const TABLES = ["people", "habits", "items", "checks", "water_logs", "nudges"];
let S = load("hz-cache", { people: [], habits: [], items: [], checks: [], water_logs: [], nudges: [] });
let outbox = load("hz-outbox", []);
let ui = load("hz-ui", { view: null, open: {}, edit: false }); ui.settings = false; ui.picker = null;
let a11y = load("hz-a11y", { size: "m", contrast: false, motion: true });
const DEFAULT_COLORS = { riad: "#0E7C7B", foufi: "#D9486F" };
const PALETTE = ["#0E7C7B", "#D9486F", "#3F51B5", "#2E7D32", "#C2410C", "#7B3FA0", "#0369A1", "#B45309", "#BE123C", "#334155"];
const EMOJI_CHOICES = ["💧","🏋️","💊","🧘","👟","🌙","📖","🥗","🍎","☀️","🧠","🦷","🚿","📵","✍️","🎸","🧹","💪","🏃","🚴","🏊","🥛","☕","🌿"];
function colorOf(pid) { const p = S.people.find(x => x.id === pid); return (p && p.color) || DEFAULT_COLORS[pid] || "#0E7C7B"; }
function applyA11y() {
  document.body.classList.toggle("contrast", !!a11y.contrast);
  document.body.classList.toggle("motion-off", !a11y.motion);
  const z = { m: 1, l: 1.15, xl: 1.3 }[a11y.size] || 1;
  document.getElementById("app").style.zoom = z;
}
let me = null;            // 'riad' | 'foufi'
let online = navigator.onLine;
let syncing = false;
let sb = null;
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); }));

function saveAll() { store("hz-cache", S); store("hz-outbox", outbox); store("hz-ui", ui); }

function applyLocal(op) {
  const arr = S[op.t];
  if (!arr) return;
  const i = arr.findIndex(r => r.id === (op.row ? op.row.id : op.id));
  if (op.kind === "delete") { if (i >= 0) arr.splice(i, 1); return; }
  if (i >= 0) arr[i] = { ...arr[i], ...op.row }; else arr.push({ ...op.row });
}

function mutate(...ops) {
  for (const op of ops) { applyLocal(op); outbox.push(op); }
  saveAll(); render(); flush();
}

async function flush() {
  if (syncing || !sb || !outbox.length) return;
  syncing = true;
  try {
    while (outbox.length) {
      const op = outbox[0];
      const q = op.kind === "delete"
        ? sb.from(op.t).delete().eq("id", op.id)
        : op.kind === "update"
          ? sb.from(op.t).update((({ id, ...rest }) => rest)(op.row)).eq("id", op.row.id)
          : sb.from(op.t).upsert(op.row);
      const { error } = await q;
      if (error) {
        // network problems: stop and retry later; data errors: drop the op so the queue never jams
        if (!navigator.onLine || /fetch|network/i.test(error.message || "")) break;
        console.warn("dropped op", op, error);
      }
      outbox.shift(); store("hz-outbox", outbox);
    }
  } catch (e) { /* offline */ }
  syncing = false;
  setStatus();
}

async function refresh() {
  if (!sb) return;
  try {
    const since = addDays(today(), -400);
    const [p, h, i, c, w, n] = await Promise.all([
      sb.from("people").select("*").order("position"),
      sb.from("habits").select("*").order("position"),
      sb.from("items").select("*").order("position"),
      sb.from("checks").select("*").gte("day", since),
      sb.from("water_logs").select("*").gte("day", addDays(today(), -60)),
      sb.from("nudges").select("*").gte("created_at", new Date(Date.now() - 7 * 864e5).toISOString()),
    ]);
    if ([p, h, i, c, w, n].some(r => r.error)) throw new Error("fetch failed");
    S = { people: p.data, habits: h.data, items: i.data, checks: c.data, water_logs: w.data, nudges: n.data };
    for (const op of outbox) applyLocal(op);   // keep offline changes visible
    saveAll(); render();
  } catch (e) { setStatus(); }
}

function subscribe() {
  sb.channel("habitizer")
    .on("postgres_changes", { event: "*", schema: "public" }, payload => {
      const t = payload.table;
      if (!S[t]) return;
      if (payload.eventType === "DELETE") applyLocal({ t, kind: "delete", id: payload.old.id });
      else applyLocal({ t, kind: "upsert", row: payload.new });
      saveAll(); render();
    })
    .subscribe();
}

// ---------- data helpers ----------
const habitsOf = who => S.habits.filter(h => h.owner === who && !h.archived).sort((a, b) => a.position - b.position);
const kids = (hid, pid) => S.items.filter(i => i.habit_id === hid && !i.archived && (i.parent_id || null) === (pid || null)).sort((a, b) => a.position - b.position);
const checkId = (hid, iid, day) => `${hid}:${iid || "-"}:${day}`;
function isDone(hid, iid, day) { const c = S.checks.find(x => x.id === checkId(hid, iid, day)); return !!(c && c.done); }
function waterToday(hid) { const t = today(); return S.water_logs.filter(w => w.habit_id === hid && w.day === t).reduce((s, w) => s + w.ml, 0); }
function isWeekly(hid) { return S.items.some(i => i.habit_id === hid && !i.archived && i.weekday); }

// leaf groups that count toward the auto-tick
function leafGroups(hid) {
  const tops = kids(hid, null);
  if (isWeekly(hid)) return tops.map(t => kids(hid, t.id)).filter(g => g.length);
  const out = [];
  const walk = list => list.forEach(it => { const c = kids(hid, it.id); c.length ? walk(c) : (!it.is_group && out.push(it)); });
  walk(tops);
  return out.length ? [out] : [];
}
// weekly habits (Gym): finishing any one day's list counts; others: every item
function allLeavesDone(hid) { const t = today(); return leafGroups(hid).some(g => g.every(x => isDone(hid, x.id, t))); }

function checkOp(hid, iid, done) {
  return { t: "checks", kind: "upsert", row: { id: checkId(hid, iid, today()), habit_id: hid, item_id: iid || null, day: today(), done, updated_by: me, updated_at: new Date().toISOString() } };
}

// ---------- actions ----------
function toggleHabit(hid) { mutate(checkOp(hid, null, !isDone(hid, null, today()))); }
function toggleLeaf(hid, iid) {
  const before = allLeavesDone(hid);
  const op = checkOp(hid, iid, !isDone(hid, iid, today()));
  applyLocal(op);
  const after = allLeavesDone(hid);
  const ops = [op];
  if (after && !isDone(hid, null, today())) ops.push(checkOp(hid, null, true));
  if (before && !after && isDone(hid, null, today())) ops.push(checkOp(hid, null, false));
  mutate(...ops);
}
function addWater(h, ml) {
  const before = waterToday(h.id);
  const ops = [{ t: "water_logs", kind: "upsert", row: { id: uuid(), habit_id: h.id, day: today(), ml, created_by: me, created_at: new Date().toISOString() } }];
  const after = before + ml;
  if (after >= h.water_goal_ml && !isDone(h.id, null, today())) ops.push(checkOp(h.id, null, true));
  mutate(...ops);
}
function undoWater(h) {
  const logs = S.water_logs.filter(w => w.habit_id === h.id && w.day === today()).sort((a, b) => (a.created_at < b.created_at ? -1 : 1));
  const last = logs.pop(); if (!last) return;
  const ops = [{ t: "water_logs", kind: "delete", id: last.id }];
  if (waterToday(h.id) - last.ml < h.water_goal_ml && isDone(h.id, null, today())) ops.push(checkOp(h.id, null, false));
  mutate(...ops);
}
function customWater(h) {
  const v = prompt("How many ml?", "330");
  const ml = parseInt(v, 10);
  if (ml > 0 && ml < 5000) addWater(h, ml);
}
function nudge(to, hid, emoji) {
  mutate({ t: "nudges", kind: "upsert", row: { id: uuid(), from_person: me, to_person: to, habit_id: hid || null, emoji, seen: false, created_at: new Date().toISOString() } });
}
function markSeen() {
  const ops = S.nudges.filter(n => n.to_person === me && !n.seen && !n.habit_id).map(n => ({ t: "nudges", kind: "upsert", row: { ...n, seen: true } }));
  if (ops.length) mutate(...ops);
}

// editing
function nextPos(list) { return list.length ? Math.max(...list.map(x => x.position)) + 1 : 0; }
function addHabit(owner, water) {
  const title = prompt(water ? "Name (e.g. Water)" : "New habit name", water ? "Water" : "");
  if (!title) return;
  let goal = null;
  if (water) { const l = parseFloat(prompt("Daily goal in litres", "2.5")); if (!(l > 0)) return; goal = Math.round(l * 1000); }
  mutate({ t: "habits", kind: "upsert", row: { id: uuid(), owner, title: title.trim(), kind: water ? "water" : "check", water_goal_ml: goal, position: nextPos(habitsOf(owner)), archived: false } });
}
function renameHabit(h) {
  const t = prompt("Rename habit", h.title); if (!t) return;
  const row = { ...h, title: t.trim() };
  if (h.kind === "water") { const l = parseFloat(prompt("Daily goal in litres", (h.water_goal_ml / 1000).toString())); if (l > 0) row.water_goal_ml = Math.round(l * 1000); }
  mutate({ t: "habits", kind: "upsert", row });
}
function deleteHabit(h) { if (confirm(`Delete "${h.title}"? Its history is kept and can be restored.`)) mutate({ t: "habits", kind: "upsert", row: { ...h, archived: true } }); }
const DAYNAMES = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"];
function addItem(hid, pid, asGroup) {
  const label = prompt(asGroup ? "Group name (start with a weekday, e.g. \"Monday — Upper\", to make it a day)" : "New item", "");
  if (!label) return;
  let weekday = null;
  if (asGroup) { const i = DAYNAMES.indexOf(label.trim().split(/[\s—-]/)[0].toLowerCase()); if (i >= 0) weekday = i + 1; }
  mutate({ t: "items", kind: "upsert", row: { id: uuid(), habit_id: hid, parent_id: pid || null, label: label.trim(), weekday, is_group: !!asGroup, position: nextPos(kids(hid, pid)), archived: false } });
}
function renameItem(it) { const l = prompt("Rename", it.label); if (l) mutate({ t: "items", kind: "upsert", row: { ...it, label: l.trim() } }); }
function deleteItem(it) { if (confirm(`Remove "${it.label}"?`)) mutate({ t: "items", kind: "upsert", row: { ...it, archived: true } }); }

function exportCsv() {
  const name = id => (S.habits.find(h => h.id === id) || {}).title || "";
  const label = id => (S.items.find(i => i.id === id) || {}).label || "";
  const lines = ["type,person,habit,item,day,value"];
  S.checks.forEach(c => { const h = S.habits.find(x => x.id === c.habit_id) || {}; lines.push(["check", h.owner, name(c.habit_id), label(c.item_id), c.day, c.done ? 1 : 0].map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")); });
  S.water_logs.forEach(w => { const h = S.habits.find(x => x.id === w.habit_id) || {}; lines.push(["water_ml", h.owner, name(w.habit_id), "", w.day, w.ml].join(",")); });
  const blob = new Blob([lines.join("\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `habitizer-${today()}.csv`; a.click();
}

// ---------- rendering ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $app = document.getElementById("app");
const A = {}; let aid = 0;
function act(fn) { const k = "a" + (aid++); A[k] = fn; return `data-a="${k}"`; }
$app.addEventListener("click", e => { const el = e.target.closest("[data-a]"); if (el && A[el.dataset.a]) { e.stopPropagation(); A[el.dataset.a](); } });
const TICK = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
function iconFor(h) {
  if (h.emoji) return h.emoji;
  const t = h.title.toLowerCase();
  if (h.kind === "water" || t.includes("water")) return "💧";
  if (/gym|lift|workout|train/.test(t)) return "🏋️";
  if (/medic|pill|vitamin|meds/.test(t)) return "💊";
  if (/stretch|yoga|mobility/.test(t)) return "🧘";
  if (/walk|step|run/.test(t)) return "👟";
  if (/sleep|bed/.test(t)) return "🌙";
  if (/read|book|study/.test(t)) return "📖";
  return "✨";
}

function bottle(total, goal) {
  const frac = Math.min(total / goal, 1), over = total > goal;
  const top = 26, bottom = 128, y = bottom - frac * (bottom - top);
  const id = "b" + goal + "_" + total;
  const path = "M26 6h18v12c9 4 13 10 13 19v86a10 10 0 0 1-10 10H23a10 10 0 0 1-10-10V37c0-9 4-15 13-19z";
  return `<svg width="66" height="134" viewBox="0 0 70 136" role="img" aria-label="${(total / 1000).toFixed(2)} of ${goal / 1000} litres">
    <defs><clipPath id="c${id}"><path d="${path}"/></clipPath>
      <linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${over ? "#A88BF5" : "#7DB8FF"}"/><stop offset="1" stop-color="${over ? "#8E6CF0" : "#3A8DFF"}"/></linearGradient></defs>
    <path d="${path}" fill="#F3F7FC"/>
    <g clip-path="url(#c${id})"><rect x="0" y="${y}" width="70" height="${136 - y}" fill="url(#g${id})"/>
      ${frac > 0 ? `<path d="M0 ${y} q9 -5 17.5 0 t17.5 0 t17.5 0 t17.5 0 V${y + 6} H0z" fill="#fff" opacity=".35"/>` : ""}
      <rect x="18" y="40" width="5" height="70" rx="2.5" fill="#fff" opacity=".55"/></g>
    <path d="${path}" fill="none" stroke="#B9C8DA" stroke-width="2.5"/>
    <rect x="24" y="0" width="22" height="8" rx="3" fill="${over ? "#8E6CF0" : "#3A8DFF"}"/></svg>`;
}

function setStatus() {
  const el = document.getElementById("status"); if (!el) return;
  const n = outbox.length;
  online = navigator.onLine;
  el.className = "status" + (online ? "" : " off");
  el.textContent = online ? (n ? `Syncing ${n} change${n > 1 ? "s" : ""}…` : "Synced") : `Offline. ${n} change${n === 1 ? "" : "s"} saved on this phone, will sync when you're back online.`;
}

function render() {
  for (const k in A) delete A[k]; aid = 0;
  if (!me) return;
  const people = S.people.length ? S.people : [{ id: "riad", display_name: "Riad" }, { id: "foufi", display_name: "Foufi" }];
  if (!ui.view) ui.view = me;
  const view = ui.view, t = today();
  document.body.className = view;
  document.body.style.setProperty("--me", colorOf(view));
  applyA11y();
  const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = colorOf(view);
  if (ui.settings) { renderSettings(); return; }
  const other = people.find(p => p.id !== me) || {};
  const viewName = (people.find(p => p.id === view) || {}).display_name || "";
  const unseen = S.nudges.filter(n => n.to_person === me && !n.seen && !n.habit_id);
  const hs = habitsOf(view);
  const doneCount = hs.filter(h => isDone(h.id, null, t)).length;
  const label = !hs.length ? "No habits yet" : doneCount === hs.length ? "Everything done today" : `${doneCount} of ${hs.length} done today`;
  let html = `<section class="hero"><div class="hero-top"><div>
      <h1>${esc(viewName)}</h1><div class="date">${esc(prettyToday())}</div></div>
      <div class="hero-actions"><button class="edit" ${act(() => { ui.settings = true; ui.picker = null; render(); window.scrollTo(0, 0); })} aria-label="Settings">⚙︎</button>
      <button class="edit ${ui.edit ? "on" : ""}" ${act(() => { ui.edit = !ui.edit; saveAll(); render(); })}>${ui.edit ? "Done" : "Edit"}</button></div></div>
      <div class="progress">${hs.map(h => `<i class="${isDone(h.id, null, t) ? "on" : ""}"></i>`).join("")}</div>
      <div class="progress-label">${esc(label)}</div></section>
    <div id="status" class="status"></div><main>`;
  if (view === me && unseen.length) {
    html += `<div class="note"><div>${esc(other.display_name)} nudged you ${unseen.map(n => esc(n.emoji)).join(" ")}</div><button class="pill" ${act(markSeen)}>Got it</button></div>`;
  }
  if (view !== me) {
    html += `<div class="note"><div>Cheer ${esc(other.display_name)} on</div><button class="pill" ${act(() => nudge(view, null, "👋"))}>Send a nudge 👋</button></div>`;
  }
  for (const h of hs) {
    const done = isDone(h.id, null, t);
    const st = streaks(S.checks.filter(c => c.habit_id === h.id && !c.item_id && c.done).map(c => c.day), t);
    const open = !!ui.open[h.id];
    const reacts = S.nudges.filter(n => n.habit_id === h.id && n.created_at && fmtDay.format(new Date(n.created_at)) === t).map(n => n.emoji).join("");
    const hasSub = h.kind !== "water" && (kids(h.id, null).length > 0 || ui.edit);
    const streakTxt = st.cur ? `🔥 ${st.cur}-day streak` : "Start a streak today";
    const toggleOpen = act(() => { ui.open[h.id] = !open; saveAll(); render(); });
    html += `<div class="habit ${done ? "is-done" : ""}"><div class="row">
      <div class="icon" aria-hidden="true">${iconFor(h)}</div>
      <div class="title" ${hasSub ? toggleOpen : ""}><b>${esc(h.title)}</b>${reacts ? `<span class="reacts">${esc(reacts)}</span>` : ""}
        <div class="meta">${streakTxt}${st.best > st.cur ? `, best ${st.best}` : ""}</div></div>
      ${ui.edit ? `<span class="tools"><button ${act(() => renameHabit(h))} aria-label="Rename">✎</button><button class="del" ${act(() => deleteHabit(h))} aria-label="Delete">✕</button></span>` : ""}
      ${hasSub ? `<button class="chev ${open ? "open" : ""}" ${toggleOpen} aria-label="Show items">›</button>` : ""}
      <button class="box ${done ? "done" : ""}" ${act(() => toggleHabit(h.id))} aria-label="Mark ${esc(h.title)} done">${TICK}</button>
    </div>`;
    if (h.kind === "water") {
      const tot = waterToday(h.id), goal = h.water_goal_ml || 2000;
      html += `<div class="water">${bottle(tot, goal)}<div class="side">
        <div class="amt">${+(tot / 1000).toFixed(2)} <small>of ${goal / 1000} L</small></div>
        ${tot > goal ? `<div class="extra">${+((tot - goal) / 1000).toFixed(2)} L over your goal</div>` : `<div class="extra" style="color:var(--soft)">${+((goal - tot) / 1000).toFixed(2)} L to go</div>`}
        <div class="wbtns"><button ${act(() => addWater(h, 250))}>+ 250 ml</button><button ${act(() => addWater(h, 500))}>+ 500 ml</button>
        <button class="quiet" ${act(() => customWater(h))}>Other amount</button><button class="quiet" ${act(() => undoWater(h))}>Undo</button></div></div></div>`;
    }
    if (open && hasSub) html += `<div class="tree">${renderTree(h)}</div>`;
    if (view !== me && done) html += `<div class="emojis">${REACTIONS.map(e => `<button ${act(() => nudge(view, h.id, e))}>${e}</button>`).join("")}</div>`;
    html += `</div>`;
  }
  if (!hs.length && !ui.edit) html += `<div class="note"><div>No habits here yet.</div><button class="pill" ${act(() => { ui.edit = true; saveAll(); render(); })}>Add one</button></div>`;
  if (ui.edit) html += `<button class="add" ${act(() => addHabit(view, false))}>+ Add habit</button><button class="add" ${act(() => addHabit(view, true))}>+ Add water habit</button>`;
  html += `</main><div class="foot"><button ${act(exportCsv)}>Export data</button><button ${act(signOut)}>Sign out</button></div>`;
  html += `<nav>${people.map(p => {
    const badge = p.id === me && unseen.length ? `<span class="dot">${unseen.length}</span>` : "";
    return `<button class="${p.id} ${p.id === view ? "on" : ""}" style="${p.id === view ? `background:${colorOf(p.id)}` : ""}" ${act(() => { ui.view = p.id; saveAll(); render(); window.scrollTo(0, 0); })}>${esc(p.display_name)}${badge}</button>`;
  }).join("")}</nav>`;
  $app.innerHTML = html;
  setStatus();
}

function renderTree(h) {
  const wd = todayWd(), t = today();
  const weekly = isWeekly(h.id);
  let out = "";
  const leaf = it => {
    const d = isDone(h.id, it.id, t);
    return `<div class="leaf ${d ? "done" : ""}">
      <button class="box small ${d ? "done" : ""}" ${act(() => toggleLeaf(h.id, it.id))} aria-label="Mark ${esc(it.label)} done">${TICK}</button>
      <span>${esc(it.label)}</span>
      ${ui.edit ? `<span class="tools"><button ${act(() => renameItem(it))} aria-label="Rename">✎</button><button class="del" ${act(() => deleteItem(it))} aria-label="Remove">✕</button></span>` : ""}</div>`;
  };
  for (const top of kids(h.id, null)) {
    const ch = kids(h.id, top.id);
    if (!(top.is_group || ch.length || top.weekday)) { out += leaf(top); continue; }
    const isToday = weekly && top.weekday === wd;
    const key = "g" + top.id;
    const open = ui.open[key] !== undefined ? ui.open[key] : (!weekly || isToday);
    const n = ch.filter(c => isDone(h.id, c.id, t)).length;
    out += `<div class="group"><div class="ghead" ${act(() => { ui.open[key] = !open; saveAll(); render(); })}>
      <span class="chev ${open ? "open" : ""}" aria-hidden="true">›</span><span class="gname">${esc(top.label)}</span>
      ${isToday ? `<span class="tag">Today</span>` : ""}${ch.length ? `<span class="count">${n}/${ch.length}</span>` : ""}
      ${ui.edit ? `<span class="tools"><button ${act(() => renameItem(top))} aria-label="Rename">✎</button><button class="del" ${act(() => deleteItem(top))} aria-label="Remove">✕</button></span>` : ""}</div>`;
    if (open) {
      out += ch.map(leaf).join("");
      if (ui.edit) out += `<button class="add" ${act(() => addItem(h.id, top.id, false))}>+ Add to ${esc(top.label)}</button>`;
    }
    out += `</div>`;
  }
  if (ui.edit) out += `<button class="add" ${act(() => addItem(h.id, null, false))}>+ Add item</button><button class="add" ${act(() => addItem(h.id, null, true))}>+ Add group or day</button>`;
  if (!out) out = `<div class="empty">Nothing listed yet. Tap Edit to add items.</div>`;
  return out;
}

// ---------- settings ----------
function renderSettings() {
  for (const k in A) delete A[k]; aid = 0;
  const people = S.people;
  const view = ui.view;
  const setColor = (pid, c) => { const p = S.people.find(x => x.id === pid); if (p) mutate({ t: "people", kind: "update", row: { id: pid, color: c } }); };
  const setEmoji = (h, e) => { ui.picker = null; mutate({ t: "habits", kind: "upsert", row: { ...h, emoji: e } }); };
  const toggle = (on, fn, label) => `<button class="toggle ${on ? "on" : ""}" role="switch" aria-checked="${on}" aria-label="${label}" ${act(fn)}></button>`;
  let html = `<div class="sheet"><div class="sheet-head"><h1>Settings</h1><button class="close" ${act(() => { ui.settings = false; ui.picker = null; render(); })}>Done</button></div>`;
  html += `<h2>Colours</h2><p class="hint">Each page's colour. Changes show on both phones.</p><div class="panel">`;
  for (const p of people) {
    html += `<div class="prow" style="display:block"><div style="font-weight:600;margin-bottom:8px">${esc(p.display_name)}</div><div class="swatches">${PALETTE.map(c =>
      `<button class="sw ${colorOf(p.id).toLowerCase() === c.toLowerCase() ? "on" : ""}" style="background:${c}" aria-label="Colour ${c}" ${act(() => setColor(p.id, c))}></button>`).join("")}</div></div>`;
  }
  html += `</div><h2>Habit icons</h2><p class="hint">Tap an icon to change it.</p><div class="seg" style="margin-bottom:10px">${people.map(p =>
    `<button class="${p.id === view ? "on" : ""}" ${act(() => { ui.view = p.id; ui.picker = null; saveAll(); render(); })}>${esc(p.display_name)}</button>`).join("")}</div><div class="panel">`;
  for (const h of habitsOf(view)) {
    html += `<div class="prow"><button class="emoji-btn" ${act(() => { ui.picker = ui.picker === h.id ? null : h.id; render(); })} aria-label="Change icon for ${esc(h.title)}">${iconFor(h)}</button><div class="grow" style="font-weight:600">${esc(h.title)}</div></div>`;
    if (ui.picker === h.id) {
      html += `<div class="picker">${EMOJI_CHOICES.map(e => `<button ${act(() => setEmoji(h, e))}>${e}</button>`).join("")}
        <button style="grid-column:span 3;font-size:15px" ${act(() => { const e = prompt("Type or paste any emoji"); if (e && e.trim()) setEmoji(h, [...e.trim()].slice(0, 2).join("")); })}>Use another</button>
        <button style="grid-column:span 3;font-size:15px" ${act(() => setEmoji(h, null))}>Automatic</button></div>`;
    }
  }
  if (!habitsOf(view).length) html += `<div class="prow"><div class="grow" style="color:var(--soft)">No habits on this page yet.</div></div>`;
  html += `</div><h2>Accessibility</h2><p class="hint">These only change this phone.</p><div class="panel">
    <div class="prow" style="display:block"><div style="font-weight:600;margin-bottom:8px">Text size</div><div class="seg">${[["m", "Standard"], ["l", "Large"], ["xl", "Extra large"]].map(([k, n]) =>
      `<button class="${a11y.size === k ? "on" : ""}" ${act(() => { a11y.size = k; store("hz-a11y", a11y); render(); })}>${n}</button>`).join("")}</div><div style="height:10px"></div></div>
    <div class="prow"><div class="grow"><div style="font-weight:600">High contrast</div><div class="meta">Darker text and stronger outlines</div></div>${toggle(a11y.contrast, () => { a11y.contrast = !a11y.contrast; store("hz-a11y", a11y); render(); }, "High contrast")}</div>
    <div class="prow"><div class="grow"><div style="font-weight:600">Animations</div><div class="meta">Turn off to stop things sliding and fading</div></div>${toggle(a11y.motion, () => { a11y.motion = !a11y.motion; store("hz-a11y", a11y); render(); }, "Animations")}</div>
  </div></div>`;
  $app.innerHTML = html;
}

// ---------- login ----------
function renderLogin(msg) {
  const saved = load("hz-email", "");
  $app.innerHTML = `<div class="login"><h1>Habitizer</h1><p style="color:var(--soft)">Who's this?</p>
    <button class="ghost" id="pick-riad">I'm Riad</button><button class="ghost" id="pick-foufi">I'm Foufi</button>
    <input id="email" type="email" placeholder="email" value="${esc(saved)}" autocomplete="username">
    <input id="pw" type="password" placeholder="password (8+ characters)" autocomplete="current-password">
    <button class="big" id="login">Log in</button>
    <button class="ghost" id="signup">First time here? Create my password</button>
    <div class="err" id="err">${esc(msg || "")}</div></div>`;
  const $e = document.getElementById("email"), $p = document.getElementById("pw"), $err = document.getElementById("err");
  document.getElementById("pick-riad").onclick = () => { $e.value = EMAILS.riad; $p.focus(); };
  document.getElementById("pick-foufi").onclick = () => { $e.value = EMAILS.foufi; $p.focus(); };
  const creds = () => {
    const email = $e.value.trim().toLowerCase(), password = $p.value;
    if (!Object.values(EMAILS).includes(email)) { $err.textContent = "That email isn't one of the two accounts."; return null; }
    if (password.length < 8) { $err.textContent = "Password needs at least 8 characters."; return null; }
    store("hz-email", email); return { email, password };
  };
  document.getElementById("login").onclick = async () => {
    const c = creds(); if (!c) return;
    $err.textContent = "Logging in…";
    const { error } = await sb.auth.signInWithPassword(c);
    if (error) { $err.textContent = error.message; return; }
    start();
  };
  document.getElementById("signup").onclick = async () => {
    const c = creds(); if (!c) return;
    $err.textContent = "Creating your account…";
    const { data, error } = await sb.auth.signUp(c);
    if (error) { $err.textContent = /registered/i.test(error.message) ? "This account already exists. Use Log in." : error.message; return; }
    if (!data.session) { $err.textContent = "Account made, but email confirmation is still switched on in Supabase. Ask Riad to turn it off, then tap Log in."; return; }
    start();
  };
}

async function signOut() { if (confirm("Sign out of Habitizer on this phone?")) { await sb.auth.signOut(); me = null; renderLogin(); } }

async function start() {
  const { data } = await sb.auth.getSession();
  const email = data.session && data.session.user.email ? data.session.user.email.toLowerCase() : null;
  if (!email) { renderLogin(); return; }
  me = Object.keys(EMAILS).find(k => EMAILS[k] === email) || null;
  if (!me) { renderLogin("This account isn't part of Habitizer."); return; }
  render(); await flush(); await refresh(); subscribe();
}

// ---------- boot ----------
let lastDay = today();
function wake() {
  if (today() !== lastDay) { lastDay = today(); render(); }
  if (me) { flush().then(refresh); }
}
window.addEventListener("online", () => { setStatus(); wake(); });
window.addEventListener("offline", setStatus);
document.addEventListener("visibilitychange", () => { if (!document.hidden) wake(); });
setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

if (window.supabase) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  start();
} else {
  $app.innerHTML = `<div class="login"><h1>Habitizer</h1><p>Open the app once while online to finish setting it up.</p></div>`;
}
</script>
</body>
</html>
