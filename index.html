.box.done{background:var(--me);border-color:var(--me)}
.box.done svg{opacity:1;transform:scale(1)}
.box:active{transform:scale(.9)}
.box.small{width:26px;height:26px;border-width:2px}
.box.small svg{width:14px;height:14px}
.chev{flex:none;color:var(--soft);font-size:22px;line-height:1;transition:transform .2s;background:none;border:none;padding:4px}

.tools button{background:none;border:none;color:var(--soft);font-size:15px;padding:4px 6px}
.tree{padding:0 14px 14px}
.group{border-top:1px solid var(--line)}
.group:first-child{border-top:none}
.ghead{display:flex;align-items:center;gap:8px;padding:12px 2px;font-weight:600}
.ghead .gname{flex:1}
.count{color:var(--soft);font-weight:500;font-size:13px}
.tag{background:var(--me);color:#fff;font-size:12px;padding:2px 9px;border-radius:20px;font-weight:600}
.leaf{display:flex;align-items:center;gap:12px;padding:8px 2px 8px 6px}
.leaf .lbl{flex:1}

.leaf.done .lbl>span{color:var(--soft);text-decoration:line-through;text-decoration-color:#B7C2CF}

.add{display:block;width:100%;text-align:left;background:none;border:1.5px dashed var(--line);color:var(--soft);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:14px}

nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:26px;display:flex;padding:6px;gap:4px;box-shadow:0 8px 24px rgba(29,36,51,.10);z-index:10}

.event .et{flex:1}

.dayhabits{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.field{margin:12px 0}

.stepper{display:flex;align-items:center;gap:14px}

.stepper b{font-size:22px;min-width:120px;text-align:center}
.actions{display:flex;gap:10px;margin-top:20px}
.actions button{flex:1;padding:14px;border-radius:14px;border:none;font-weight:700;font-size:16px}
.save{background:var(--me);color:#fff}
.cancel{background:#E3E8EF;color:var(--ink)}
.danger{background:none!important;color:var(--warn)!important;flex:none!important;padding:14px 4px!important}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:none}
.prow .grow{flex:1}

.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;padding:0;box-shadow:inset 0 0 0 3px #fff}
.sw.on{border-color:var(--ink)}
.emoji-btn{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--me-tint);font-size:24px;padding:0}
.picker{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:6px 0 12px}
.picker button{height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:24px;padding:0}

.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--me)}
.toggle.on::after{left:23px}
.login{max-width:380px;margin:0 auto;padding:16vh 22px 0;text-align:center}
.login h1{font-size:44px;margin:0 0 6px;letter-spacing:-1px}
.login input{width:100%;font-size:17px;padding:14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);margin:6px 0;text-align:center}
.lbig{width:100%;font-size:17px;padding:14px;border-radius:14px;border:none;background:#0E7C7B;color:#fff;font-weight:700;margin:8px 0}
.ghost{width:100%;font-size:16px;padding:13px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);margin:5px 0}
.err{color:var(--warn);font-size:14px;min-height:20px}
.foot{display:flex;justify-content:center;gap:18px;padding:22px}
.foot button{background:none;border:none;color:var(--soft);font-size:13px;text-decoration:underline}
.empty{color:var(--soft);font-size:14px;padding:4px 2px 2px}
body.motion-off *{transition:none!important}
body.contrast{--soft:#2E3747;--line:#8E9AAB}
body.contrast .habit,body.contrast .note,body.contrast nav,body.contrast .card{border-width:2px}
body.contrast .box{border-color:#5D6878}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const fmtDay = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });

// ---------- habit helpers ----------
const habitsOf = who => S.habits.filter(h => h.owner === who && !h.archived).sort((a, b) => a.position - b.position);

// does this habit need doing today? (for the progress bar)

function streakOf(h, t = today()) {

// ---------- actions ----------

// ---------- person page ----------
function renderPerson(view) {

  const unit = st.unit === "week" ? "week" : "day";
  let meta = st.cur ? `🔥 ${st.cur}-${unit} streak` : (st.unit === "week" ? "Hit your weekly goal to start a streak" : "Start a streak today");
  if (st.best > st.cur) meta += `, best ${st.best}`;
  if (h.schedule === "target") meta = `${weekDone(h, t)} of ${h.target} this week · ` + meta;
  else if (h.schedule === "days") meta = `${scheduleText(h)} · ` + meta;
  const toggleOpen = act(() => { ui.open[h.id] = !open; saveAll(); render(); });
  let html = `<div class="habit ${done ? "is-done" : ""} ${rest ? "rest" : ""}"><div class="row">
    <div class="icon" aria-hidden="true">${iconFor(h)}</div>
    <div class="title" ${hasSub ? toggleOpen : ""}><b>${esc(h.title)}</b>${rest ? `<span class="chip">${h.schedule === "target" ? "Goal met" : "Not today"}</span>` : ""}${reacts ? `<span class="reacts">${esc(reacts)}</span>` : ""}
      <div class="meta">${esc(meta)}</div></div>
    ${ui.edit ? `<span class="tools"><button ${act(() => openHabitSheet(h))} aria-label="Edit ${esc(h.title)}">✎</button></span>` : ""}
    ${hasSub ? `<button class="chev ${open ? "open" : ""}" ${toggleOpen} aria-label="Show items">›</button>` : ""}
    <button class="box ${done ? "done" : ""}" ${act(() => toggleHabit(h.id))} aria-label="Mark ${esc(h.title)} done">${TICK}</button></div>`;
  if (h.kind === "water") {
    const tot = amountOn(h.id, t), goal = h.water_goal_ml || 2000;
    html += `<div class="water">${bottle(tot, goal)}<div class="side"><div class="amt">${+(tot / 1000).toFixed(2)} <small>of ${goal / 1000} L</small></div>
      ${tot > goal ? `<div class="extra over">${+((tot - goal) / 1000).toFixed(2)} L over your goal</div>` : `<div class="extra">${+((goal - tot) / 1000).toFixed(2)} L to go</div>`}
      <div class="wbtns"><button ${act(() => logAmount(h, 250))}>+ 250 ml</button><button ${act(() => logAmount(h, 500))}>+ 500 ml</button>
      <button class="quiet" ${act(() => { const ml = parseInt(prompt("How many ml?", "330"), 10); if (ml > 0 && ml < 5000) logAmount(h, ml); })}>Other amount</button><button class="quiet" ${act(() => undoWater(h))}>Undo</button></div></div></div>`;
  }
  if (open && hasSub) html += `<div class="tree">${renderTree(h)}</div>`;
  if (view !== me && done) html += `<div class="emojis">${REACTIONS.map(e => `<button ${act(() => nudge(view, h.id, e))}>${e}</button>`).join("")}</div>`;
  return html + `</div>`;
}

function renderCounter(h) {
  const t = today(), n = amountOn(h.id, t);
  const week = daysBetween(addDays(t, -6), t).reduce((s, d) => s + amountOn(h.id, d), 0);
  return `<div class="habit"><div class="row"><div class="icon" aria-hidden="true">${iconFor(h)}</div>
    <div class="title"><b>${esc(h.title)}</b><div class="meta">Last 7 days: ${week} (about ${+(week / 7).toFixed(1)} a day)</div></div>
    ${ui.edit ? `<span class="tools"><button ${act(() => openHabitSheet(h))} aria-label="Edit ${esc(h.title)}">✎</button></span>` : ""}
    <div class="counter"><button ${act(() => logAmount(h, -1))} aria-label="One less">−</button><span class="n" aria-live="polite">${n}</span><button ${act(() => logAmount(h, 1))} aria-label="One more">+</button></div></div></div>`;
}

function renderTree(h) {
  const t = today(), wd = todayWd(), weekly = isWeekly(h.id);
  let out = "";
  const leaf = it => {
    const d = isDone(h.id, it.id, t), on = itemOn(it, t);
    const when = it.days && it.days.length && it.days.length < 7 ? it.days.slice().sort().map(x => WDN[x - 1]).join(", ") : "";
    return `<div class="leaf ${d ? "done" : ""} ${on ? "" : "off"}">
      <button class="box small ${d ? "done" : ""}" ${act(() => toggleLeaf(h.id, it.id))} aria-label="Mark ${esc(it.label)} done">${TICK}</button>
      <div class="lbl"><span>${esc(it.label)}</span>${when ? `<small>${esc(when)}${on ? "" : " (not today)"}</small>` : ""}</div>
      ${ui.edit ? `<span class="tools"><button ${act(() => openItemSheet(h, it))} aria-label="Edit ${esc(it.label)}">✎</button></span>` : ""}</div>`;
  };
  for (const top of kids(h.id, null)) {
    const ch = kids(h.id, top.id);
    if (!(top.is_group || ch.length || top.weekday)) { out += leaf(top); continue; }
    const isToday = weekly && top.weekday === wd, key = "g" + top.id;
    const open = ui.open[key] !== undefined ? ui.open[key] : (!weekly || isToday);
    const n = ch.filter(c => isDone(h.id, c.id, t)).length;
    out += `<div class="group"><div class="ghead" ${act(() => { ui.open[key] = !open; saveAll(); render(); })}>
      <span class="chev ${open ? "open" : ""}" aria-hidden="true">›</span><span class="gname">${esc(top.label)}</span>
      ${isToday ? `<span class="tag">Today</span>` : ""}${ch.length ? `<span class="count">${n}/${ch.length}</span>` : ""}
      ${ui.edit ? `<span class="tools"><button ${act(() => openItemSheet(h, top))} aria-label="Edit ${esc(top.label)}">✎</button></span>` : ""}</div>`;
    if (open) { out += ch.map(leaf).join(""); if (ui.edit) out += `<button class="add" ${act(() => openItemSheet(h, null, top.id))}>+ Add to ${esc(top.label)}</button>`; }
    out += `</div>`;
  }
  if (ui.edit) out += `<button class="add" ${act(() => openItemSheet(h, null, null))}>+ Add item</button><button class="add" ${act(() => openItemSheet(h, null, null, true))}>+ Add group or day</button>`;
  return out || `<div class="empty">Nothing listed yet. Tap Edit to add items.</div>`;
}

// ---------- scores ----------
function renderScores() {
  const t = today();
  const from = ui.period === "month" ? t.slice(0, 8) + "01" : weekStart(t);
  const prevFrom = ui.period === "month" ? (() => { const [y, m] = t.split("-").map(Number); return new Date(Date.UTC(y, m - 2, 1)).toISOString().slice(0, 10); })() : addDays(from, -7);
  const prevTo = addDays(from, -1);
  const ids = ["riad", "foufi"];
  const stats = {};
  for (const p of ids) {
    const hs = habitsOf(p).filter(tracked);
    const per = hs.map(h => ({ h, c: consistency(h, from, t), s: streakOf(h) }));
    const vals = per.map(x => x.c).filter(x => x != null);
    const prevVals = hs.map(h => consistency(h, prevFrom, prevTo)).filter(x => x != null);
    const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    const hadPrev = S.checks.some(c => c.done && c.day >= prevFrom && c.day <= prevTo && hs.some(h => h.id === c.habit_id));
    const prev = hadPrev && prevVals.length ? prevVals.reduce((a, b) => a + b, 0) / prevVals.length : null;
    const ticks = S.checks.filter(c => !c.item_id && c.done && c.day >= from && c.day <= t && hs.some(h => h.id === c.habit_id)).length;
    const topStreak = per.reduce((m, x) => x.s.cur > m.s ? { s: x.s.cur, h: x.h, u: x.s.unit } : m, { s: 0, h: null, u: "day" });
    const water = habitsOf(p).find(h => h.kind === "water");
    const days = daysBetween(from, t);
    const waterAvg = water ? days.reduce((s, d) => s + amountOn(water.id, d), 0) / days.length / 1000 : null;
    // strongest and weakest weekday over the last 8 weeks
    const byWd = Array.from({ length: 7 }, () => []);
    for (const d of daysBetween(addDays(t, -55), addDays(t, -1))) { const sc = dayScore(p, d); if (sc != null) byWd[wdOf(d) - 1].push(sc); }
    const wdAvg = byWd.map(a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
    stats[p] = { per, avg, prev, ticks, topStreak, waterAvg, wdAvg };
  }
  const [a, b] = ids, sa = stats[a].avg, sb_ = stats[b].avg;
  let lead = "No data yet for this period. Tick a few habits and check back.";
  if (sa != null && sb_ != null) {
    const per = ui.period === "month" ? "this month" : "this week";
    if (Math.abs(sa - sb_) < 0.005) lead = `Dead even ${per} at ${pct(sa)} each.`;
    else { const w = sa > sb_ ? a : b, l = w === a ? b : a; lead = `${nameOf(w)} is ahead ${per}: ${pct(stats[w].avg)} vs ${pct(stats[l].avg)}.`; }
  }
  let html = hero("Scores", ui.period === "month" ? `${MONTHS[+t.slice(5, 7) - 1]} so far` : `Week of ${prettyDay(from)}`) + `</section><div id="status" class="status"></div><main>`;
  html += `<div class="seg" style="margin-top:12px">${[["week", "This week"], ["month", "This month"]].map(([k, n]) => `<button class="${ui.period === k ? "on" : ""}" ${act(() => { ui.period = k; saveAll(); render(); })}>${n}</button>`).join("")}</div>`;
  const winner = sa != null && sb_ != null && Math.abs(sa - sb_) >= 0.005 ? (sa > sb_ ? a : b) : null;
  html += `<div class="card"><h2>Head to head</h2><p class="lead">${esc(lead)}</p><div class="vs">${ids.map(p => {
    const s = stats[p];
    const trend = s.avg != null && s.prev != null ? (s.avg >= s.prev ? `up from ${pct(s.prev)}` : `down from ${pct(s.prev)}`) : "";
    return `<div style="background:${colorOf(p)}">${winner === p ? `<span class="crown" aria-label="Leader">👑</span>` : ""}<div class="lbl">${esc(nameOf(p))}</div><div class="big">${pct(s.avg)}</div><div class="lbl">on track${trend ? `, ${trend}` : ""}</div>
      <div class="lbl" style="margin-top:8px">${s.ticks} habits done</div>${s.topStreak.h ? `<div class="lbl">Longest run: ${s.topStreak.s} ${s.topStreak.u}${s.topStreak.s === 1 ? "" : "s"} of ${esc(s.topStreak.h.title)}</div>` : ""}</div>`;
  }).join("")}</div></div>`;
  // all-time leaderboard
  const board = [];
  for (const p of ids) for (const x of stats[p].per) if (x.s.best > 0) board.push({ p, h: x.h, best: x.s.best, unit: x.s.unit, cur: x.s.cur });
  board.sort((x, y) => (y.best * (y.unit === "week" ? 7 : 1)) - (x.best * (x.unit === "week" ? 7 : 1)));
  html += `<div class="card"><h2>Best streaks of all time</h2>${board.length ? board.slice(0, 8).map((r, i) => `<div class="rank"><span class="pos">${i + 1}</span><span class="who" style="background:${colorOf(r.p)}"></span><span class="nm">${iconFor(r.h)} ${esc(r.h.title)} <span class="meta" style="display:inline">${esc(nameOf(r.p))}</span></span><span class="val">${r.best} ${r.unit}${r.best === 1 ? "" : "s"}</span></div>`).join("") : `<p class="hint" style="margin:6px 0 0">Streaks show up here once you've ticked something two days running.</p>`}</div>`;
  // per-person breakdown
  for (const p of ids) {
    html += `<div class="card"><h2>${esc(nameOf(p))}'s habits</h2>${stats[p].per.map(x => `<div class="hrow"><div class="top"><span>${iconFor(x.h)} ${esc(x.h.title)}</span><b>${pct(x.c)}</b></div><div class="bar"><i style="width:${Math.round((x.c || 0) * 100)}%;background:${colorOf(p)}"></i></div><div class="meta">${esc(scheduleText(x.h))}, ${x.s.cur ? `current run ${x.s.cur} ${x.s.unit}${x.s.cur === 1 ? "" : "s"}` : "no current run"}</div></div>`).join("") || `<p class="hint">No habits yet.</p>`}</div>`;
  }
  // insights
  const ins = [];
  for (const p of ids) {
    const s = stats[p];
    const valid = s.wdAvg.map((v, i) => [v, i]).filter(x => x[0] != null);
    if (valid.length >= 3) {
      const best = valid.reduce((m, x) => x[0] > m[0] ? x : m), worst = valid.reduce((m, x) => x[0] < m[0] ? x : m);
      if (best[0] - worst[0] >= 0.15) ins.push(`${nameOf(p)} is strongest on ${WDFULL[best[1]]}s (${pct(best[0])}) and slips most on ${WDFULL[worst[1]]}s (${pct(worst[0])}).`);
    }
    const weakest = s.per.filter(x => x.c != null).sort((x, y) => x.c - y.c)[0];
    if (weakest && weakest.c < 0.6) ins.push(`${nameOf(p)}'s toughest habit right now is ${weakest.h.title} at ${pct(weakest.c)}.`);
    if (s.waterAvg != null) { const goal = (habitsOf(p).find(h => h.kind === "water").water_goal_ml || 2000) / 1000; ins.push(`${nameOf(p)} is drinking ${s.waterAvg.toFixed(1)} L a day on average (goal ${goal} L).`); }
  }
  html += `<div class="card"><h2>What stands out</h2>${ins.length ? ins.map(x => `<div class="insight">${esc(x)}</div>`).join("") : `<p class="hint" style="margin:6px 0 0">Insights appear after a week or two of logging.</p>`}</div>`;
  return html + `</main>`;
}

// ---------- calendar ----------
function renderCalendar() {
  const t = today();
  if (!ui.calDay) ui.calDay = t;
  const sel = ui.calDay;
  let html = hero("Calendar", "Plans and habits, together") + `</section><div id="status" class="status"></div><main>`;
  html += `<div class="seg" style="margin-top:12px">${[["week", "Week"], ["month", "Month"]].map(([k, n]) => `<button class="${ui.calMode === k ? "on" : ""}" ${act(() => { ui.calMode = k; saveAll(); render(); })}>${n}</button>`).join("")}</div>`;
  const who = ui.calWho || "all";
  html += `<div class="whochips">${[["all", "Everyone", ""], ["riad", nameOf("riad"), colorOf("riad")], ["foufi", nameOf("foufi"), colorOf("foufi")]].map(([k, n, c]) => `<button class="${who === k ? "on" : ""}" style="${c ? `color:${c}` : ""}" ${act(() => { ui.calWho = k; saveAll(); render(); })}>${esc(n)}</button>`).join("")}</div>`;
  const evOn = d => S.events.filter(e => e.day === d && (who === "all" || e.who === who || e.who === "both")).sort((x, y) => (x.start_time || "") < (y.start_time || "") ? -1 : 1);
  const whoName = e => e.who === "both" ? "Both of you" : nameOf(e.who);
  if (ui.calMode === "month") {
    const first = sel.slice(0, 8) + "01", [y, m] = sel.split("-").map(Number);
    const last = new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10);
    const shift = n => { const d = new Date(Date.UTC(y, m - 1 + n, 1)).toISOString().slice(0, 10); ui.calDay = d; render(); };
    html += `<div class="calnav"><button ${act(() => shift(-1))} aria-label="Previous month">‹</button><b>${MONTHS[m - 1]} ${y}</b><button ${act(() => shift(1))} aria-label="Next month">›</button></div>`;
    html += `<div class="month">${WDN.map(w => `<div class="wd">${w}</div>`).join("")}`;
    for (let d = weekStart(first); d <= addDays(weekStart(last), 6); d = addDays(d, 1)) {
      const evs = evOn(d);
      html += `<button class="cell ${d.slice(0, 7) !== first.slice(0, 7) ? "out" : ""} ${d === t ? "today" : ""} ${d === sel ? "sel" : ""}" ${act(() => { ui.calDay = d; render(); })} aria-label="${prettyDay(d, true)}${evs.length ? `, ${evs.length} plan${evs.length > 1 ? "s" : ""}` : ""}">
        <span class="dn">${+d.slice(8)}</span>${evs.map(e => `<span class="lbl${evs.length > 2 ? " one" : ""}" style="background:${evColor(e)}">${esc(e.title)}</span>`).join("")}</button>`;
    }
    html += `</div>`;
  } else {
    const ws = weekStart(sel);
    const shift = n => { ui.calDay = addDays(sel, 7 * n); render(); };
    html += `<div class="calnav"><button ${act(() => shift(-1))} aria-label="Previous week">‹</button><b>${prettyDay(ws)} – ${prettyDay(addDays(ws, 6))}</b><button ${act(() => shift(1))} aria-label="Next week">›</button></div><div class="agenda">`;
    const dayHead = d => `<div class="ad"><span>${WDN[wdOf(d) - 1]}</span><b>${+d.slice(8)}</b></div>`;
    let i = 0;
    while (i < 7) {
      const d = addDays(ws, i), evs = evOn(d);
      if (evs.length || d === t) {
        html += `<button class="arow ${d === sel ? "sel" : ""} ${d === t ? "today" : ""}" ${act(() => { ui.calDay = d; render(); })} aria-label="${prettyDay(d, true)}">${dayHead(d)}<div class="ab">${evs.map(e => `<div class="ablock" style="background:${evColor(e)}"><b>${e.start_time ? fmtTime(e.start_time) + " · " : ""}${esc(e.title)}</b><small>${esc(whoName(e))}</small></div>`).join("") || `<div class="afree">Today · nothing planned</div>`}</div></button>`;
        i++;
      } else {
        let j = i; while (j + 1 < 7 && !evOn(addDays(ws, j + 1)).length && addDays(ws, j + 1) !== t) j++;
        const a = addDays(ws, i), b = addDays(ws, j);
        const lbl = i === j ? prettyDay(a) : `${prettyDay(a)} – ${prettyDay(b)}`;
        const txt = i === j ? "Free day" : `Free until ${WDN[wdOf(b) - 1]} ${+b.slice(8)}`;
        const isSel = sel >= a && sel <= b;
        html += `<button class="arow ${isSel ? "sel" : ""}" ${act(() => { ui.calDay = a; render(); })} aria-label="Free ${lbl}">${dayHead(a)}<div class="ab"><div class="afree">${esc(txt)}</div></div></button>`;
        i = j + 1;
      }
    }
    html += `</div>`;
  }
  // selected day
  const evs = evOn(sel);
  html += `<div class="card"><h2>${esc(prettyDay(sel, true))}</h2>`;
  html += evs.length ? evs.map(e => `<button class="event" ${act(() => openEventSheet(e))}><span class="stripe" style="background:${evColor(e)}"></span>
      <span class="et"><b>${esc(e.title)}</b><small>${e.start_time ? `${fmtTime(e.start_time)}${e.end_time ? "–" + fmtTime(e.end_time) : ""}` : "All day"}, ${e.who === "both" ? "both of you" : esc(nameOf(e.who))}${e.note ? `. ${esc(e.note)}` : ""}</small></span></button>`).join("")
    : `<p class="hint" style="margin:4px 0 0">No plans.</p>`;
  html += `<button class="add" ${act(() => openEventSheet(null, sel))}>+ Add a plan</button>`;
  if (sel <= t) {
    html += `<h2 style="font-size:17px;margin:16px 0 6px">Habits</h2><div class="dayhabits">${["riad", "foufi"].map(p => {
      const hs = habitsOf(p).filter(h => tracked(h) && (scheduledOn(h, sel) || isDone(h.id, null, sel)));
      return `<div><h3 style="color:${colorOf(p)}">${esc(nameOf(p))}</h3>${hs.map(h => `<div>${isDone(h.id, null, sel) ? "✅" : "▫️"} ${esc(h.title)}</div>`).join("") || `<div class="meta">Nothing scheduled</div>`}</div>`;
    }).join("")}</div>`;
  }
  return html + `</div></main>`;
}

// ---------- sheets (forms) ----------
function openHabitSheet(h, owner) {
  ui.sheet = { type: "habit", h, d: h ? { title: h.title, kind: h.kind, goal: (h.water_goal_ml || 2500) / 1000, schedule: h.schedule || "daily", days: [...(h.days || [])], target: h.target || 3 }
    : { title: "", kind: "check", goal: 2.5, schedule: "daily", days: [], target: 3, owner } };
  render();
}
function openItemSheet(h, it, parentId, asGroup) {
  ui.sheet = { type: "item", h, it, d: it ? { label: it.label, every: !(it.days && it.days.length), days: [...(it.days || [])] } : { label: "", every: true, days: [], parentId, asGroup: !!asGroup } };
  render();
}
function openEventSheet(e, day) {
  ui.sheet = { type: "event", e, d: e ? { title: e.title, day: e.day, allDay: !e.start_time, start: fmtTime(e.start_time), end: fmtTime(e.end_time), who: e.who, note: e.note || "" }
    : { title: "", day, allDay: false, start: "19:00", end: "", who: "both", note: "" } };
  render();
}
function closeSheet() { ui.sheet = null; render(); }
const dayChips = (sel, fn) => `<div class="daychips">${WDN.map((w, i) => `<button class="${sel.includes(i + 1) ? "on" : ""}" ${act(() => fn(i + 1))} aria-pressed="${sel.includes(i + 1)}">${w.slice(0, 2)}</button>`).join("")}</div>`;
const toggleDay = (arr, n) => { const i = arr.indexOf(n); i >= 0 ? arr.splice(i, 1) : arr.push(n); };

function renderSheet() {
  const s = ui.sheet, d = s.d;
  let body = "";
  if (s.type === "habit") {
    const isNew = !s.h;
    body += `<div class="sheet-head"><h1>${isNew ? "New habit" : "Edit habit"}</h1></div>
      <div class="field"><label for="f-title">Name</label><input id="f-title" type="text" data-f="title" value="${esc(d.title)}" placeholder="e.g. Read 10 pages"></div>`;
    if (isNew) body += `<div class="field"><label>Type</label><div class="seg">${[["check", "Checklist"], ["water", "Water goal"], ["counter", "Counter"]].map(([k, n]) => `<button class="${d.kind === k ? "on" : ""}" ${act(() => { d.kind = k; render(); })}>${n}</button>`).join("")}</div>
      <p class="hint" style="margin-top:6px">${d.kind === "counter" ? "A + and − to count things through the day. No streak." : d.kind === "water" ? "A bottle that fills up as you log water." : "A tick box, with optional items inside."}</p></div>`;
    if (d.kind === "water") body += `<div class="field"><label for="f-goal">Daily goal (litres)</label><input id="f-goal" type="number" step="0.25" min="0.25" data-f="goal" value="${esc(d.goal)}"></div>`;
    if (d.kind !== "counter") {
      body += `<div class="field"><label>How often</label><div class="seg">${[["daily", "Every day"], ["days", "Certain days"], ["target", "Times a week"]].map(([k, n]) => `<button class="${d.schedule === k ? "on" : ""}" ${act(() => { d.schedule = k; render(); })}>${n}</button>`).join("")}</div></div>`;
      if (d.schedule === "days") body += `<div class="field"><label>Which days</label>${dayChips(d.days, n => { toggleDay(d.days, n); render(); })}</div>`;
      if (d.schedule === "target") body += `<div class="field"><label>Times per week</label><div class="stepper"><button ${act(() => { d.target = Math.max(1, d.target - 1); render(); })} aria-label="Fewer">−</button><b>${d.target} time${d.target > 1 ? "s" : ""}</b><button ${act(() => { d.target = Math.min(7, d.target + 1); render(); })} aria-label="More">+</button></div><p class="hint" style="margin-top:6px">Any days count. Your streak counts weeks you hit this.</p></div>`;
    }
    body += `<div class="actions">${!isNew ? `<button class="danger" ${act(() => { if (confirm(`Delete "${s.h.title}"? Its history is kept.`)) { mutate({ t: "habits", kind: "upsert", row: { ...s.h, archived: true } }); closeSheet(); } })}>Delete</button>` : ""}
      <button class="cancel" ${act(closeSheet)}>Cancel</button><button class="save" ${act(saveHabitSheet)}>${isNew ? "Add habit" : "Save"}</button></div>`;
  }
  if (s.type === "item") {
    const isNew = !s.it, grp = isNew ? d.asGroup : (s.it.is_group || !!s.it.weekday);
    body += `<div class="sheet-head"><h1>${isNew ? (grp ? "New group" : "New item") : "Edit"}</h1></div>
      <div class="field"><label for="f-label">Name</label><input id="f-label" type="text" data-f="label" value="${esc(d.label)}" placeholder="${grp ? "e.g. Morning, or Monday — Upper" : "e.g. Vitamin D"}"></div>`;
    if (!grp) {
      body += `<div class="field"><label>Which days</label><div class="seg">${[[true, "Every day"], [false, "Certain days"]].map(([k, n]) => `<button class="${d.every === k ? "on" : ""}" ${act(() => { d.every = k; render(); })}>${n}</button>`).join("")}</div>`;
      if (!d.every) body += `<div style="height:10px"></div>${dayChips(d.days, n => { toggleDay(d.days, n); render(); })}<p class="hint" style="margin-top:6px">On other days it's shown faded and doesn't count.</p>`;
      body += `</div>`;
    } else if (isNew) body += `<p class="hint">Start the name with a weekday (e.g. "Tuesday — Lower") to make it that day's list.</p>`;
    body += `<div class="actions">${!isNew ? `<button class="danger" ${act(() => { if (confirm(`Remove "${s.it.label}"?`)) { mutate({ t: "items", kind: "upsert", row: { ...s.it, archived: true } }); closeSheet(); } })}>Remove</button>` : ""}
      <button class="cancel" ${act(closeSheet)}>Cancel</button><button class="save" ${act(saveItemSheet)}>${isNew ? "Add" : "Save"}</button></div>`;
  }
  if (s.type === "event") {
    const isNew = !s.e;
    body += `<div class="sheet-head"><h1>${isNew ? "New plan" : "Edit plan"}</h1></div>
      <div class="field"><label for="f-et">What</label><input id="f-et" type="text" data-f="title" value="${esc(d.title)}" placeholder="e.g. Dinner at Em Sherif"></div>
      <div class="field"><label for="f-ed">Date</label><input id="f-ed" type="date" data-f="day" value="${esc(d.day)}"></div>
      <div class="field"><label>Time</label><div class="seg">${[[false, "Set a time"], [true, "All day"]].map(([k, n]) => `<button class="${d.allDay === k ? "on" : ""}" ${act(() => { d.allDay = k; render(); })}>${n}</button>`).join("")}</div>
      ${d.allDay ? "" : `<div style="display:flex;gap:10px;margin-top:10px"><input type="time" data-f="start" value="${esc(d.start)}" aria-label="Starts"><input type="time" data-f="end" value="${esc(d.end)}" aria-label="Ends (optional)"></div>`}</div>
      <div class="field"><label>Who's it for</label><div class="seg">${[["both", "Both"], ["riad", nameOf("riad")], ["foufi", nameOf("foufi")]].map(([k, n]) => `<button class="${d.who === k ? "on" : ""}" ${act(() => { d.who = k; render(); })}>${esc(n)}</button>`).join("")}</div></div>
      <div class="field"><label for="f-en">Note (optional)</label><input id="f-en" type="text" data-f="note" value="${esc(d.note)}"></div>
      <div class="actions">${!isNew ? `<button class="danger" ${act(() => { if (confirm("Delete this plan?")) { mutate({ t: "events", kind: "delete", id: s.e.id }); closeSheet(); } })}>Delete</button>` : ""}
      <button class="cancel" ${act(closeSheet)}>Cancel</button><button class="save" ${act(saveEventSheet)}>${isNew ? "Add plan" : "Save"}</button></div>`;
  }
  return `<div class="overlay" ${act(e => { if (e.target.classList.contains("overlay")) closeSheet(); })}><div class="sheet" role="dialog" aria-modal="true">${body}</div></div>`;
}
function saveHabitSheet() {
  const s = ui.sheet, d = s.d;
  if (!d.title.trim()) { alert("Give it a name first."); return; }
  if (d.schedule === "days" && !d.days.length) { alert("Pick at least one day."); return; }
  const goal = Math.round(parseFloat(d.goal) * 1000);
  const base = s.h ? { ...s.h } : { id: uuid(), owner: d.owner, kind: d.kind, position: nextPos(habitsOf(d.owner)), archived: false };
  Object.assign(base, { title: d.title.trim(), schedule: base.kind === "counter" ? "daily" : d.schedule, days: d.schedule === "days" ? d.days.slice().sort() : null, target: d.schedule === "target" ? d.target : null });
  if (base.kind === "water") base.water_goal_ml = goal > 0 ? goal : 2000;
  ui.sheet = null; mutate({ t: "habits", kind: "upsert", row: base });
}
function saveItemSheet() {
  const s = ui.sheet, d = s.d;
  if (!d.label.trim()) { alert("Give it a name first."); return; }
  if (!d.every && !d.days.length) { alert("Pick at least one day."); return; }
  let row;
  if (s.it) row = { ...s.it, label: d.label.trim(), days: d.every ? null : d.days.slice().sort() };
  else {
    let weekday = null;
    if (d.asGroup) { const i = WDFULL.map(x => x.toLowerCase()).indexOf(d.label.trim().split(/[\s—-]/)[0].toLowerCase()); if (i >= 0) weekday = i + 1; }
    row = { id: uuid(), habit_id: s.h.id, parent_id: d.parentId || null, label: d.label.trim(), weekday, is_group: !!d.asGroup, days: d.every || d.asGroup ? null : d.days.slice().sort(), position: nextPos(kids(s.h.id, d.parentId)), archived: false };
  }
  ui.sheet = null; mutate({ t: "items", kind: "upsert", row });
}
function saveEventSheet() {
  const s = ui.sheet, d = s.d;
  if (!d.title.trim() || !d.day) { alert("Add what it is and the date."); return; }
  const row = { id: s.e ? s.e.id : uuid(), title: d.title.trim(), day: d.day, start_time: d.allDay || !d.start ? null : d.start, end_time: d.allDay || !d.end ? null : d.end, who: d.who, note: d.note.trim() || null, created_by: s.e ? s.e.created_by : me };
  ui.sheet = null; ui.calDay = d.day; mutate({ t: "events", kind: "upsert", row });
  if (!s.e && d.who !== me) notifyPartner(me === "riad" ? "foufi" : "riad", `📅 added a plan: ${row.title}, ${prettyDay(row.day)}${row.start_time ? " at " + fmtTime(row.start_time) : ""}`);
}

// ---------- settings ----------
function renderSettings() {
  const ps = people(), view = ui.view === "foufi" || ui.view === "riad" ? ui.view : me;
  const setColor = (pid, c) => mutate({ t: "people", kind: "update", row: { id: pid, color: c } });
  const setEmoji = (h, e) => { ui.picker = null; mutate({ t: "habits", kind: "upsert", row: { ...h, emoji: e } }); };
  const toggle = (on, fn, label) => `<button class="toggle ${on ? "on" : ""}" role="switch" aria-checked="${on}" aria-label="${label}" ${act(fn)}></button>`;
  let html = `<div class="sheet full"><div class="sheet-head"><h1>Settings</h1><button class="pill" ${act(() => { ui.settings = false; ui.picker = null; render(); })}>Done</button></div>`;
  // notifications
  const standalone = window.navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  const pushOn = load("hz-push", false) && pushSupported() && Notification.permission === "granted";
  html += `<h2>Notifications</h2><p class="hint">Get a notification when ${esc(nameOf(me === "riad" ? "foufi" : "riad"))} nudges you, reacts to a habit, or adds a plan for you.</p><div class="panel"><div class="prow"><div class="grow">`;
  if (pushOn) html += `<b>On for this phone</b></div><span>✅</span>`;
  else if (!pushSupported()) html += `<b>Not available here</b><div class="meta">${standalone ? "Update your iPhone to iOS 16.4 or later." : "Open Habitizer from your home-screen icon, then come back here."}</div></div>`;
  else html += `<b>Off</b><div class="meta">Turn on for this phone</div></div><button class="pill" ${act(enablePush)}>Turn on</button>`;
  html += `</div></div>`;
  html += `<h2>Colours</h2><p class="hint">Each page's colour. Changes show on both phones.</p><div class="panel">`;
  for (const p of ps) html += `<div class="prow" style="display:block"><div style="font-weight:600;margin-bottom:8px">${esc(p.display_name)}</div><div class="swatches">${PALETTE.map(c => `<button class="sw ${colorOf(p.id).toLowerCase() === c.toLowerCase() ? "on" : ""}" style="background:${c}" aria-label="Colour ${c}" ${act(() => setColor(p.id, c))}></button>`).join("")}</div></div>`;
  html += `</div><h2>Habit icons</h2><p class="hint">Tap an icon to change it.</p><div class="seg" style="margin-bottom:10px">${ps.map(p => `<button class="${p.id === view ? "on" : ""}" ${act(() => { ui.view = p.id; ui.picker = null; saveAll(); render(); })}>${esc(p.display_name)}</button>`).join("")}</div><div class="panel">`;
  for (const h of habitsOf(view)) {
    html += `<div class="prow"><button class="emoji-btn" ${act(() => { ui.picker = ui.picker === h.id ? null : h.id; render(); })} aria-label="Change icon for ${esc(h.title)}">${iconFor(h)}</button><div class="grow" style="font-weight:600">${esc(h.title)}</div></div>`;
    if (ui.picker === h.id) html += `<div class="picker">${EMOJI_CHOICES.map(e => `<button ${act(() => setEmoji(h, e))}>${e}</button>`).join("")}
      <button style="grid-column:span 3;font-size:15px" ${act(() => { const e = prompt("Type or paste any emoji"); if (e && e.trim()) setEmoji(h, [...e.trim()].slice(0, 2).join("")); })}>Use another</button>
      <button style="grid-column:span 3;font-size:15px" ${act(() => setEmoji(h, null))}>Automatic</button></div>`;
  }
  html += `</div><h2>Accessibility</h2><p class="hint">These only change this phone.</p><div class="panel">
    <div class="prow" style="display:block"><div style="font-weight:600;margin-bottom:8px">Text size</div><div class="seg">${[["m", "Standard"], ["l", "Large"], ["xl", "Extra large"]].map(([k, n]) => `<button class="${a11y.size === k ? "on" : ""}" ${act(() => { a11y.size = k; store("hz-a11y", a11y); render(); })}>${n}</button>`).join("")}</div><div style="height:10px"></div></div>
    <div class="prow"><div class="grow"><div style="font-weight:600">High contrast</div><div class="meta">Darker text and stronger outlines</div></div>${toggle(a11y.contrast, () => { a11y.contrast = !a11y.contrast; store("hz-a11y", a11y); render(); }, "High contrast")}</div>
    <div class="prow"><div class="grow"><div style="font-weight:600">Animations</div><div class="meta">Turn off to stop things sliding and fading</div></div>${toggle(a11y.motion, () => { a11y.motion = !a11y.motion; store("hz-a11y", a11y); render(); }, "Animations")}</div></div></div>`;
  return html;
}

// ---------- login ----------
function renderLogin(msg) {
  const saved = load("hz-email", "");
  $app.innerHTML = `<div class="login"><h1>Habitizer</h1><p style="color:var(--soft)">Who's this?</p>
    <button class="ghost" id="pick-riad">I'm Riad</button><button class="ghost" id="pick-foufi">I'm Foufi</button>
    <input id="email" type="email" placeholder="email" value="${esc(saved)}" autocomplete="username">
    <input id="pw" type="password" placeholder="password (8+ characters)" autocomplete="current-password">
    <button class="lbig" id="login">Log in</button><button class="ghost" id="signup">First time here? Create my password</button>
    <div class="err" id="err">${esc(msg || "")}</div></div>`;
  const $e = document.getElementById("email"), $p = document.getElementById("pw"), $err = document.getElementById("err");
  document.getElementById("pick-riad").onclick = () => { $e.value = EMAILS.riad; $p.focus(); };
  document.getElementById("pick-foufi").onclick = () => { $e.value = EMAILS.foufi; $p.focus(); };
  const creds = () => {
    const email = $e.value.trim().toLowerCase(), password = $p.value;
    if (!Object.values(EMAILS).includes(email)) { $err.textContent = "That email isn't one of the two accounts."; return null; }
    if (password.length < 8) { $err.textContent = "Password needs at least 8 characters."; return null; }
    store("hz-email", email); return { email, password };
  };
  document.getElementById("login").onclick = async () => { const c = creds(); if (!c) return; $err.textContent = "Logging in…"; const { error } = await sb.auth.signInWithPassword(c); if (error) { $err.textContent = error.message; return; } start(); };
  document.getElementById("signup").onclick = async () => {
    const c = creds(); if (!c) return; $err.textContent = "Creating your account…";
    const { data, error } = await sb.auth.signUp(c);
    if (error) { $err.textContent = /registered/i.test(error.message) ? "This account already exists. Use Log in." : error.message; return; }
    if (!data.session) { $err.textContent = "Account made, but email confirmation is still on in Supabase. Turn it off, then tap Log in."; return; }
    start();
  };
}
async function signOut() { if (confirm("Sign out of Habitizer on this phone?")) { await sb.auth.signOut(); me = null; renderLogin(); } }
async function start() {
  const { data } = await sb.auth.getSession();
  const email = data.session && data.session.user.email ? data.session.user.email.toLowerCase() : null;
  if (!email) { renderLogin(); return; }
  me = Object.keys(EMAILS).find(k => EMAILS[k] === email) || null;
  if (!me) { renderLogin("This account isn't part of Habitizer."); return; }
  render(); await flush(); await refresh(); subscribe();
}

// ---------- boot ----------
let lastDay = today();
function wake() { if (today() !== lastDay) { lastDay = today(); render(); } if (me) flush().then(refresh); }
window.addEventListener("online", () => { setStatus(); wake(); });
window.addEventListener("offline", setStatus);
document.addEventListener("visibilitychange", () => { if (!document.hidden) wake(); });
setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
    document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded && !ui.sheet) { reloaded = true; location.reload(); } });
}
if (window.supabase) { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } }); start(); }
else $app.innerHTML = `<div class="login"><h1>Habitizer</h1><p>Open the app once while online to finish setting it up.</p></div>`;
</script>
</body>
</html>
